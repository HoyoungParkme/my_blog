name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # 경력기술서·프로젝트 상세 PDF를 지금 콘텐츠로 다시 만든다 (scripts/makePdfs.mjs, 러너에 있는 Chrome 사용).
      # public/pdf/에 생기고 빌드가 dist/로 복사한다. 실패하면 배포를 멈춘다 — PDF 버튼이 깨진 채 올라가지 않게
      - name: Make PDFs
        run: npm run pdf

      - name: Build
        run: npm run build

      # 라우트별 HTML과 404.html은 빌드(scripts/routeHtmlPlugin.ts)가 만든다
      - name: Deploy To gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
